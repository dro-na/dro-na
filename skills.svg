<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#001f3f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#000814;stop-opacity:1"/>
    </linearGradient>

    <!-- Text gradients -->
    <linearGradient id="gradMy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradSkills" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00CED1;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle text shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="black" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="10" ry="10"/>

  <!-- Text -->
  <text x="50%" y="50%" font-size="60" font-family="Arial" font-weight="bold" text-anchor="middle" dominant-baseline="middle" stroke="#000000" stroke-width="1" filter="url(#shadow)">
    <tspan fill="url(#gradMy)">MY</tspan>
    <tspan fill="url(#gradSkills)"> SKILLS</tspan>
  </text>
</svg>
